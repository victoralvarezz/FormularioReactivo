
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Registro de Usuario</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">

    <ion-list lines="full">

      <!-- Nombre completo -->
      <ion-item>
        <ion-input
          label="Nombre completo"
          labelPlacement="floating"
          type="text"
          formControlName="nombre"
          errorText="El nombre es obligatorio (mínimo 3 caracteres).">
        </ion-input>
      </ion-item>

      <!-- Correo electrónico -->
      <ion-item>
        <ion-input
          label="Correo electrónico"
          labelPlacement="floating"
          type="email"
          inputmode="email"
          formControlName="email"
          errorText="Introduce un correo electrónico válido.">
        </ion-input>
      </ion-item>

      <!-- Contraseña -->
      <ion-item>
        <ion-input
          label="Contraseña"
          labelPlacement="floating"
          type="password"
          formControlName="password"
          errorText="Mínimo 8 caracteres, letras y números.">
        </ion-input>
      </ion-item>

      <!-- Fecha de nacimiento -->
      <ion-item>
        <ion-input
          label="Fecha de nacimiento"
          labelPlacement="floating"
          type="date"
          formControlName="fechaNacimiento"
          [max]="fechaMaxima"
          errorText="La fecha es obligatoria y no puede ser posterior a hoy.">
        </ion-input>
      </ion-item>

    </ion-list>

    <!-- Botón para enviar -->
    <div class="ion-padding-top">

      <ion-button
        expand="block"
        type="submit"
        [disabled]="registroForm.invalid || isSubmitting()">

        @if (isSubmitting()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Registrarse
        }

      </ion-button>

    </div>

  </form>

</ion-content>
